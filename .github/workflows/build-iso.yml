name: Build AetherOS ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Run tests
        run: make test

      - name: Build ISO in a Debian 13 container
        run: bash ./build/docker-build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: aether-os-iso
          path: |
            dist/aether-os-x86_64.iso
            dist/aether-os-x86_64.iso.sha256
          compression-level: 0
          retention-days: 14
